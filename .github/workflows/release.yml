name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PROJECT_VERSION="$(awk -F'"' '/CFBundleShortVersionString/ {print $2}' project.yml | head -1)"
          if [[ "$TAG" != "$PROJECT_VERSION" ]]; then
            echo "Tag v$TAG does not match project.yml version $PROJECT_VERSION" >&2
            exit 1
          fi

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kana-send-dmg
          path: dist/*.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            dist/*.dmg \
            --title "$TAG" \
            --generate-notes
